name: Nightly stress test

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    # 3x unit suite + build + browser stress need more headroom than the test job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A separate process per repeat, not vitest's --repeats: that reruns suites inside one
      # worker process, and several suites keep state across repeats there (e.g. an owner row
      # that only the first repeat may create). Each repeat shuffles with its own printed seed,
      # so a failure can be replayed with --sequence.seed.
      - run: |
          for _ in 1 2 3; do
            seed=$RANDOM
            echo "shuffle seed $seed"
            npm test -- --sequence.shuffle --sequence.seed=$seed
          done
      - run: npm run build
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # One retry: the apt mirror hung twice in practice, a transient network blip, not a
      # product bug; the outer timeout-minutes is still the hard ceiling either way.
      - timeout-minutes: 8
        run: timeout 3m npx playwright install --with-deps --no-shell chromium || timeout 3m npx playwright install --with-deps --no-shell chromium
      - id: browser
        # taskset pins the whole process tree (Playwright, the dev server, Chromium) to one CPU
        # core, so the runner is as contended as the slower CI runner where tests actually flaked.
        run: taskset --cpu-list 0 npm run test:browser -- --repeat-each=3
      - if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-browser-test-results
          path: test-results/
          retention-days: 7

  # Needs the network, so it stays out of the per-push CI: the pinned Rekta Design commit must still build the
  # vendored rekta.css, and Rekta's default branch must not have moved the tokens on since.
  rekta-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/sync-rekta.ts --check

  # Separate job so only this one needs issues: write, scoped to the single step that uses it.
  report-failure:
    needs: [stress, rekta-drift]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STRESS_RESULT: ${{ needs.stress.result }}
          REKTA_DRIFT_RESULT: ${{ needs.rekta-drift.result }}
        run: |
          set -euo pipefail
          report() {
            local title="$1" body="The nightly workflow failed: $RUN_URL"
            existing=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" --body "$body"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body"
            fi
          }
          if [ "$STRESS_RESULT" = failure ]; then report "Nightly stress run failing"; fi
          if [ "$REKTA_DRIFT_RESULT" = failure ]; then report "Rekta Design tokens drifted from upstream"; fi
