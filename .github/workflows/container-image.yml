name: Container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nur dieser Job: Push nach GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Kein docker/metadata-action: bei nur zwei Auslösern (Tag v*, manuell) reichen ein
      # paar Zeilen Shell für die Tag-Liste, ohne eine weitere Action zu vertrauen.
      - name: Tags bestimmen
        id: tags
        run: |
          image="ghcr.io/${{ github.repository }}"
          tags="$image:sha-${GITHUB_SHA:0:7},$image:latest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="$image:${GITHUB_REF#refs/tags/v},$tags"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
