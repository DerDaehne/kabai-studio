name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # GitHub's 360 min default would leave main red for hours on a hung step.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browser download is cached; the system libraries it needs come from apt on every run.
      # One retry: the apt mirror hung twice in practice, a transient network blip, not a
      # product bug; the outer timeout-minutes is still the hard ceiling either way.
      - timeout-minutes: 8
        run: timeout 3m npx playwright install --with-deps --no-shell chromium || timeout 3m npx playwright install --with-deps --no-shell chromium
      - id: browser
        run: npm run test:browser
      - if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  # Separate job: an audit finding shares no job status with the tests, so a red npm audit
  # cannot be mistaken for a red test run in the PR status.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No --omit=dev: package.json has only devDependencies (adapter-node bundles them into
      # build/), so --omit=dev would drop the whole tree from the audit.
      - run: npm audit --audit-level=high
