name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # GitHub's 360 min default would leave main red for hours on a hung step.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browser download is cached; the system libraries it needs come from apt on every run.
      # One retry: the apt mirror hung twice in practice, a transient network blip, not a
      # product bug; the outer timeout-minutes is still the hard ceiling either way.
      - timeout-minutes: 8
        run: timeout 3m npx playwright install --with-deps --no-shell chromium || timeout 3m npx playwright install --with-deps --no-shell chromium
      - id: browser
        run: npm run test:browser
      - if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  # Separate job: an audit finding shares no job status with the tests, so a red npm audit
  # cannot be mistaken for a red test run in the PR status.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No --omit=dev: package.json has only devDependencies (adapter-node bundles them into
      # build/), so --omit=dev would drop the whole tree from the audit.
      - run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Unit and browser tests run in the repository, where every source file exists; only the shipped
      # image shows a file the Dockerfile's runtime stage forgot to copy.
      - run: docker build --build-arg STUDIO_VERSION=ci -t studio-ci .
      - name: Start the image and wait for /api/health
        run: |
          docker run -d --name studio --network host -e HOST=127.0.0.1 -e PORT=3311 studio-ci
          for _ in $(seq 1 30); do
            if health=$(curl -fsS http://127.0.0.1:3311/api/health); then echo "$health"; exit 0; fi
            sleep 1
          done
          docker logs studio
          exit 1
      # The running container's /api/health bakes STUDIO_VERSION in at build time (vite's `define`);
      # --version re-reads it at runtime from the image (#982) — both must agree on the same build.
      - name: --version matches /api/health, and the legacy CLI subcommands resolve
        run: |
          health_version=$(curl -fsS http://127.0.0.1:3311/api/health | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          cli_version=$(docker run --rm studio-ci node server.ts --version)
          [ "$cli_version" = "ci" ] || { echo "FAIL: --version printed '$cli_version', expected the build's STUDIO_VERSION 'ci'"; exit 1; }
          [ "$health_version" = "$cli_version" ] || { echo "FAIL: /api/health reports '$health_version', --version reports '$cli_version'"; exit 1; }
          echo "ok: --version -> $cli_version (matches /api/health)"
          # restore.ts/reset-password.ts dynamically import files the runtime stage must also ship (server.ts's
          # runLegacyScript); a fresh container with no backup file/database still exercises their full static
          # import closure and exits 1 on their own usage/error message — ERR_MODULE_NOT_FOUND means a COPY line
          # in the Dockerfile's runtime stage is missing a file.
          for cmd in restore reset-password; do
            out=$(docker run --rm studio-ci node server.ts "$cmd" 2>&1) && rc=0 || rc=$?
            if echo "$out" | grep -q ERR_MODULE_NOT_FOUND; then
              echo "FAIL: $cmd hit ERR_MODULE_NOT_FOUND:"; echo "$out"; exit 1
            fi
            [ "$rc" -eq 1 ] || { echo "FAIL: $cmd exited $rc, expected its usage/error exit code 1"; exit 1; }
            echo "ok: $cmd usage path -> exit 1, no ERR_MODULE_NOT_FOUND"
          done
