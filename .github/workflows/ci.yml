name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Kein --omit=dev: package.json hat nur devDependencies (adapter-node bündelt sie in
      # build/), --omit=dev würde damit den gesamten Baum aus dem Audit werfen. Nach build,
      # damit ein Audit-Ausfall (z. B. Registry down) nicht das Build-Ergebnis verdeckt.
      - run: npm audit --audit-level=high
